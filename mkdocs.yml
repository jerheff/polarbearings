site_name: Polarbearings
site_description: High-performance machine learning metrics as native Polars expressions
site_url: https://polarbearings.readthedocs.io/
repo_url: https://github.com/jerheff/polarbearings
repo_name: jerheff/polarbearings
edit_uri: edit/main/docs/
copyright: Copyright &copy; Jeremy Heffner — MIT License

# docs_dir defaults to `docs`. Internal working material is not published: audits,
# scratch idea dumps, and the raw Polars-release log are excluded from the build
# entirely (this also suppresses the "not in nav" warning under --strict).
exclude_docs: |
  audit-*.md
  FUTURE_IDEAS.md
  polars-releases-2025-2026.md

theme:
  name: material
  icon:
    logo: material/compass-outline
    repo: fontawesome/brands/github
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.sections
    - navigation.top
    - content.code.copy
    - content.action.edit
    # Replace the browser's native (laggy, unstyled) title tooltip with Material's
    # positioned, themed tooltip — used by the mkdocstrings type cross-refs.
    - content.tooltips
    - toc.follow
    - search.suggest
    - search.highlight
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode

nav:
  - Home: index.md
  - Guides:
      - Metrics catalog: guides/METRICS.md
      - Testing: guides/TESTING.md
  - Technical:
      - Performance: technical/PERFORMANCE.md
      - Polars compatibility: technical/POLARS_COMPATIBILITY.md
  - API reference:
      - Type aliases: api/types.md
      - Ranking & probabilistic: api/ranking.md
      - Classification: api/classification.md
      - Regression: api/regression.md
      - Calibration: api/calibration.md
      - Curves: api/curves.md
      - Thresholds & weights: api/thresholds.md
      - Bootstrap & splitting: api/resampling.md
  - Changelog: changelog.md
  - Contributing: contributing.md

plugins:
  - search
  - mkdocstrings:
      default_handler: python
      handlers:
        python:
          # Static analysis of the source tree — no need to install the package.
          paths: [src]
          options:
            docstring_style: google
            docstring_section_style: table
            show_root_heading: true
            show_root_full_path: false
            show_source: true
            members_order: source
            separate_signature: true
            show_signature_annotations: true
            signature_crossrefs: true
            merge_init_into_class: true
            filters: ["!^_"]

markdown_extensions:
  # Reuse the root README / CHANGELOG / CONTRIBUTING verbatim (single source of
  # truth) via `--8<-- "FILE"` includes; base_path is the repo root (this file's dir).
  - pymdownx.snippets:
      base_path: ["."]
      check_paths: true
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - tables
  - toc:
      permalink: true
