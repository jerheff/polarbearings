site_name: Polarbearings
site_description: High-performance machine learning metrics as native Polars expressions
site_url: https://polarbearings.readthedocs.io/
repo_url: https://github.com/jerheff/polarbearings
repo_name: jerheff/polarbearings
edit_uri: edit/main/docs/
copyright: Copyright &copy; Jeremy Heffner — MIT License

# docs_dir defaults to `docs`. Internal working material is not published: audits,
# scratch idea dumps, and the raw Polars-release log are excluded from the build
# entirely (this also suppresses the "not in nav" warning under --strict).
exclude_docs: |
  audit-*.md
  FUTURE_IDEAS.md
  polars-releases-2025-2026.md

theme:
  name: material
  icon:
    logo: material/compass-outline
    repo: fontawesome/brands/github
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.sections
    - navigation.top
    - content.code.copy
    - content.action.edit
    # Replace the browser's native (laggy, unstyled) title tooltip with Material's
    # positioned, themed tooltip — used by the mkdocstrings type cross-refs.
    - content.tooltips
    - toc.follow
    - search.suggest
    - search.highlight
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode

nav:
  - Home: index.md
  - Guides:
      - Metrics catalog: guides/METRICS.md
      - Testing: guides/TESTING.md
  - Technical:
      - Performance: technical/PERFORMANCE.md
      - Polars compatibility: technical/POLARS_COMPATIBILITY.md
  - API reference:
      - Type aliases: api/types.md
      - Ranking & probabilistic: api/ranking.md
      - Classification: api/classification.md
      - Regression: api/regression.md
      - Calibration: api/calibration.md
      - Curves: api/curves.md
      - Thresholds & weights: api/thresholds.md
      - Bootstrap & splitting: api/resampling.md
  - Changelog: changelog.md
  - Contributing: contributing.md

plugins:
  - search
  - mkdocstrings:
      default_handler: python
      handlers:
        python:
          # Static analysis of the source tree — no need to install the package.
          paths: [src]
          options:
            docstring_style: google
            docstring_section_style: table
            show_root_heading: true
            show_root_full_path: false
            show_source: true
            members_order: source
            separate_signature: true
            show_signature_annotations: true
            signature_crossrefs: true
            merge_init_into_class: true
            filters: ["!^_"]
  # Emit llms.txt (a curated markdown index) and llms-full.txt (the whole corpus
  # in one file) for LLM/agent consumers. Listed AFTER mkdocstrings so it reads the
  # fully-rendered API pages, then converts their HTML back to clean markdown. Read
  # the Docs serves both from the site root once they're in the build output.
  - llmstxt:
      markdown_description: >-
        Polarbearings implements ~40 machine learning metrics as native Polars
        expressions — 2–4× faster than scikit-learn across ranking, classification,
        regression, and calibration. Every metric is a Polars expression, usable
        anywhere an expression is allowed (select / group_by / over / lazy pipelines)
        and callable as name("target", "score") with optional sample weights.
      full_output: llms-full.txt
      sections:
        Overview:
          - index.md: Project overview, installation, and quick-start examples.
        Guides:
          - guides/METRICS.md: >-
              Complete metric catalogue — per-metric semantics, edge cases, output
              naming, sample weights, and scikit-learn correspondences.
          - guides/TESTING.md: >-
              How the library is tested — pytest, Hypothesis property-based tests,
              scikit-learn parity, and multi-version Polars compatibility.
        Technical:
          - technical/PERFORMANCE.md: Benchmark methodology and speedup results vs scikit-learn.
          - technical/POLARS_COMPATIBILITY.md: Supported Polars versions and the stable expression APIs used.
        API reference:
          - api/types.md: Public type aliases (IntoExpr, WeightInput, …) used across signatures.
          - api/ranking.md: Ranking & probabilistic metrics — ROC AUC, average precision, Gini, log loss, Brier.
          - api/classification.md: Threshold-based classification metrics, confusion matrix, threshold sweep.
          - api/regression.md: Regression error, deviance, and goodness-of-fit metrics.
          - api/calibration.md: Calibration curve, expected (ECE) and maximum (MCE) calibration error.
          - api/curves.md: Diagnostic curve generators — ROC, PR, DET, expected cost, confusion cell.
          - api/thresholds.md: Threshold specifications and balanced sample / class weights.
          - api/resampling.md: Bootstrap confidence intervals and deterministic id-keyed data splitting.
        Project:
          - changelog.md: Release history and notable changes.
          - contributing.md: Development setup, testing, and how to add a new metric.

markdown_extensions:
  # Reuse the root README / CHANGELOG / CONTRIBUTING verbatim (single source of
  # truth) via `--8<-- "FILE"` includes; base_path is the repo root (this file's dir).
  - pymdownx.snippets:
      base_path: ["."]
      check_paths: true
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - tables
  - toc:
      permalink: true
