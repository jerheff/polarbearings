[project]
name = "polarbearings"
version = "0.3.0"
description = "High-performance machine learning metrics for Polars DataFrames"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Jeremy Heffner", email = "3886031+jerheff@users.noreply.github.com" }]
keywords = [
    "polars",
    "metrics",
    "machine-learning",
    "data-science",
    "roc-auc",
    "classification",
    "regression",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering",
    "Typing :: Typed",
]
dependencies = [
    "polars>=1.0.0",
]

[project.urls]
Homepage = "https://github.com/jerheff/polarbearings"
Repository = "https://github.com/jerheff/polarbearings"
Issues = "https://github.com/jerheff/polarbearings/issues"

[build-system]
requires = ["uv_build>=0.11.22,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
# Floors kept current so `lowest-direct` gives a modern dev env. numpy/scikit-learn are
# test-only (the wheel depends on polars alone), so bump them freely like any other tool.
dev = [
    "ty>=0.0.74",
    "ruff>=0.16.4",
    "pytest>=9.1.1",
    "pytest-cov>=7.1",
    "pytest-benchmark>=5.2.3",
    "pytest-timeout>=2.4",
    # Randomizes test order to surface inter-test coupling; reproduce with --randomly-seed=<n>.
    "pytest-randomly>=4.1",
    "hypothesis[numpy]>=6.165.10",
    # Runs the README's Python blocks as tests (via root conftest), so doc drift fails CI.
    "sybil>=10.1",
    "mutmut>=3.7.0",
    # 2.4.6 is the last numpy supporting Python 3.11; don't bump past it while we support 3.11.
    "numpy>=2.4.6",
    "scikit-learn>=1.9",
]
# Docs site toolchain. A dependency-group (not an extra) keeps it out of the wheel metadata;
# Read the Docs installs it via `uv sync --group docs`.
docs = [
    "mkdocs-material>=9.7.7",
    # Floor at 1.0: an older mkdocstrings breaks against the latest transitive mkdocs-autorefs
    # (AttributeError on link_titles).
    "mkdocstrings[python]>=1.0.6",
    # Emits llms.txt / llms-full.txt from the rendered HTML for LLM/agent consumers.
    "mkdocs-llmstxt>=0.5",
]
# Docs/diagnostics notebook tooling; dev-only, never shipped.
notebooks = [
    "plotly>=6.9.0",
    "nbformat>=5.11.1",
    "nbconvert>=7.17.1",
    "ipykernel>=7.3",
]
# Per-test memory ceilings for the CI "Memory limits" job. Out of `dev` so the 3.11-3.14
# matrix skips it (memray is Linux/macOS only).
memory = [
    "pytest-memray>=1.10.0",
]

[tool.uv]
required-version = ">=0.11"

# Lock direct deps at their LOWEST versions (esp. polars>=1.0.0) so dev/CI hits the advertised
# floors and catches newer-API use early; transitives still resolve highest. The upper bound is
# guarded by `just test-highest` / the highest-resolution CI job.
resolution = "lowest-direct"
# Release-age cooldown: skip anything uploaded within this rolling window (a duration, so uv
# records `exclude-newer-span` in the lock). Applies to all uv resolution — sync, CI, and the
# floors `just autoupdate` picks. prek/pinact carry matching cooldowns in their own config.
exclude-newer = "7 days"

# uv's native PEP 517 backend; also ship tests/ in the sdist for downstream packagers.
[tool.uv.build-backend]
source-include = ["tests/**"]

# Test PyPI for dry-run publishing. `explicit` keeps it out of resolution (used only when
# named: `uv publish --index testpypi`).
[[tool.uv.index]]
name = "testpypi"
url = "https://test.pypi.org/simple/"
publish-url = "https://test.pypi.org/legacy/"
explicit = true

[tool.ruff]
line-length = 100
# Notebooks are narrative .ipynb, not shipped code (mirrors the ty exclude).
extend-exclude = ["notebooks"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "B",    # flake8-bugbear
    "C4",   # flake8-comprehensions
    "UP",   # pyupgrade
    "ANN",  # flake8-annotations
    "D",    # pydocstyle
    "N",    # pep8-naming
    "RUF",  # ruff-specific rules
    "SIM",  # flake8-simplify
    "RET",  # flake8-return
    "PIE",  # flake8-pie
    "TC",   # flake8-type-checking
    "ARG",  # flake8-unused-arguments
    "PT",   # flake8-pytest-style
    "PERF", # perflint
    "FURB", # refurb
    "T10",  # flake8-debugger
    "A",    # flake8-builtins
    "EM",   # flake8-errmsg
    "ISC",  # flake8-implicit-str-concat
    "FLY",  # flynt
    "PGH",  # pygrep-hooks
    "RSE",  # flake8-raise
    "TID",  # flake8-tidy-imports
    "PLE",  # pylint errors
    "PLW",  # pylint warnings
]
ignore = [
    "E501",    # line length — handled by the formatter
    "ANN401",  # allow explicit `Any` where genuinely dynamic
    "RUF002",  # ambiguous unicode in docstrings (µ, ×, ², ₙ are intentional)
    "RUF003",  # ambiguous unicode in comments (same)
    "RUF022",  # __all__ grouped by metric category, not sorted
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
# Tests/benchmarks: skip annotation/docstring/unused-arg rules (noisy, low value).
"tests/**" = ["ANN", "D", "ARG"]
"benchmarks/**" = ["ANN", "D", "ARG"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
# ruff >=0.16 also formats Python blocks in Markdown; kept on since the README blocks run as
# tests (Sybil). Use `<!-- fmt: off -->` / `<!-- fmt: on -->` for deliberate hand-wrapping.

[tool.ty.src]
# Notebooks aren't part of the typed package (mirrors the ruff extend-exclude).
exclude = ["notebooks"]

[tool.ty.environment]
python-version = "3.11"

[tool.pytest]
testpaths = ["tests"]
python_files = ["test_*.py", "bench_*.py"]
python_functions = ["test_*"]
addopts = ["--import-mode=importlib"]
strict = true
# Fail if a relied-on plugin is missing (else coverage/ordering/timeouts silently drop).
# memray excluded (memory-only group); sybil hooks in via conftest, not as a plugin.
required_plugins = [
    "hypothesis",
    "pytest-benchmark",
    "pytest-cov",
    "pytest-randomly",
    "pytest-timeout",
]
markers = [
    "hypothesis: property-based tests using Hypothesis (slow)",
    "limit_memory: pytest-memray per-test peak-memory ceiling (enforced under --memray)",
    "limit_leaks: pytest-memray per-test leak ceiling (enforced under --memray)",
]
# Every warning is a failure — esp. numpy/polars RuntimeWarnings (div-by-zero, overflow,
# invalid) that silently yield NaN/inf, the bug class this library exists to get right.
filterwarnings = ["error"]

[tool.coverage.run]
source = ["polarbearings"]
# Branch coverage: a version-gated `if` taking one arc on a given Polars version reads as
# partial, so the 100% gate needs both arcs (floor + 1.36 runs; see `just test-cov`).
branch = true

[tool.coverage.report]
omit = ["tests/*", "benchmarks/*"]
# 100% gate (CI + `just test-cov`); needs a floor + 1.36 run combined for version-gated paths.
fail_under = 100

[tool.mutmut]
paths_to_mutate = ["src/polarbearings/"]
tests_dir = ["tests/"]
# Skip the slow property-based tests during mutation runs.
pytest_add_cli_args = ["-m", "not hypothesis"]
# CAVEAT — mutmut 3.x forks per mutant (ignoring test_command); Polars' rayon engine is
# fork-unsafe, so any parallel op deadlocks and is killed as a spurious "timeout" — which
# counts as "caught" and can mask a genuine survivor. There's no option to disable the fork.
# SOURCE OF TRUTH: activate a mutant via the trampoline and run pytest as a subprocess (no
# fork), e.g. from mutants/:
#   MUTANT_UNDER_TEST=polarbearings.<module>.<mutant> \
#     PYTHONPATH=src ../.venv/bin/python -m pytest tests/ -m 'not hypothesis'
# Nonzero exit == killed. Use mutmut only to ENUMERATE candidates. See docs/guides/TESTING.md.
